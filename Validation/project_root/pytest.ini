[pytest]
testpaths = tests
pythonpath = .
addopts = -v --html=report.html --self-contained-html
markers =
    # Task 1 Dynamically Generated Markers
    category: Tests for company categorization
    employee_size: Tests for employee size buckets
    nature_of_company: Tests for company structure
    all_fields: Tests spanning all field constraints
    global_record: Cross-field consistency and scaling tests
    brand_sentiment_score: Tests for brand sentiment
    glassdoor_rating: Tests for glassdoor scoring
    indeed_rating: Tests for indeed scoring
    google_reviews_rating: Tests for google reviews scoring
    net_promoter_score_nps: Tests for NPS score
    work_culture: Tests for work culture sentiment
    manager_quality: Tests for management quality sentiment
    psychological_safety: Tests for psychological safety classification
    customer_concentration_risk: Risk validation tests
    geopolitical_risks: Geopolitical risk tests
    burn_rate: Burn rate logic tests
    runway: Runway duration logic tests
    macro_risks: Macroeconomic risk tests
    cybersecurity_posture: Cybersecurity risk tests
    token_limit_handling: Token and length limits tests
    memory_independence: Session memory independence tests
    
    # Custom framework markers
    input_validation: Core input validation rules (Regex, Enums, Not Null)
    all_parameters: Entity-level rules testing
    null_handling: Null assignment and defaulting tests
