[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_functions = test_*
markers =
    category: Test cases for company category
    employee_size: Test cases for employee size validation
    nature_of_company: Test cases for nature of company
    all_fields: Comprehensive field validation
    global_record: Global record consistency checks
    brand_sentiment_score: Sentiment score validation
    glassdoor_rating: Glassdoor rating mapping
    indeed_rating: Indeed rating mapping
    google_reviews_rating: Google reviews mapping
    net_promoter_score_nps: NPS mapping
    work_culture: Culture sentiment extraction
    manager_quality: Manager quality sentiment
    psychological_safety: Psychological safety enum
    customer_concentration_risk: Customer concentration risk
    geopolitical_risks: Geopolitical risks
    burn_rate: Burn rate assessment
    runway: Runway critical risk detection
    macro_risks: Macroeconomic risks
    cybersecurity_posture: Cybersecurity posture
    token_limit_handling: Token limit and truncation handling
    memory_independence: Request isolation and memory leakage checks
    general: General test cases
addopts = -v --tb=short
